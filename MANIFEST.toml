fr = "Ce plugin fournit une nouvelle fonction de script `$logline()` permettant d'écrire des entrées dans le journal système de Picard. Par défaut, le niveau de journalisation est défini sur `Info`, mais il est possible d'utiliser n'importe quel niveau en le spécifiant comme deuxième paramètre facultatif de la fonction.\n\nLa fonction s'utilise comme suit :\n\n`$logline(texte[,niveau])`\n\noù `texte` correspond au texte à écrire dans le journal. L'entrée sera écrite au niveau de journalisation `Info` par défaut, mais cela peut être modifié en spécifiant un niveau différent en tant que deuxième paramètre facultatif. Les niveaux de journalisation autorisés sont :\n\n- E (Erreur) - W (Avertissement) - I (Info) - D (Débogage)\n\nSi un niveau inconnu est saisi, la fonction utilisera le niveau par défaut `Info`."
zh_CN = "此插件提供了一个新的脚本函数 `$logline()` 来写入条目到 Picard 的系统日志。默认情况下，日志级别设置为 `Info`，但可以通过向函数提供级别作为可选的第二参数来使用任何级别。\n\n该函数的使用方式为：\n\n`$logline(text[,level])`\n\n其中 `text` 是要写入日志的文本。条目默认以 `Info` 级别写入日志，但可以通过指定不同的级别作为可选的第二参数来更改。允许的日志级别是：\n\n- E (错误) - W (警告) - I (信息) - D (调试)\n\n如果输入了未知级别，函数将使用默认的 `Info` 级别。"
